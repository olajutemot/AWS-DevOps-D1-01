version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22

  build:
    commands:
      - echo "Starting CI/CD validation..."
      - test -f index.html
      - test -f package.json
      - test -f server.js
      - node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
      - node --check server.js
      - grep -q "task-9-final-test-v1" index.html
      - echo "All application checks passed."

artifacts:
  files:
    - '**/*'
